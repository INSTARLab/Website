include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: v0.2.5
    file: '/pipelines/static-site.yml'

variables:
  GITHUB_REPO: "INSTARLab/Website"
  SITE_DIR: "."

# Astro owns the production artifact. Override the included template's
# root-copying `pages` job so GitLab Pages publishes dist/ instead of the
# repository source tree. `extends: []` is the explicit opt-out from the
# included `.pages:deploy` template, matching the mirror job below: without it
# the job only avoids the template's root-copying script because its own keys
# happen to win the merge.
pages:
  extends: []
  stage: deploy
  image: node:22-bookworm-slim
  before_script:
    # Shared runners are unprivileged, so Corepack cannot write under
    # /usr/local/bin. Run the pinned pnpm release from npx's user cache.
    - npx --yes --package=pnpm@12.4.1 pnpm --version
  script:
    # Project Pages is served below /Website/. Keep the custom-domain and
    # local builds at /, but make every generated asset and route URL point at
    # the actual GitLab Pages mount so fonts are not requested from the GitLab
    # instance root (which redirects protected paths to OAuth).
    - export ASTRO_BASE="$(node scripts/quality/resolve-pages-base.mjs)"
    - echo "Building GitLab Pages with base ${ASTRO_BASE}"
    - npx --yes --package=pnpm@12.4.1 pnpm install --frozen-lockfile
    # The artifact that ships to GitHub Pages is the CNAME-rooted one, and it is
    # built here — from the same source and the same node_modules — so the demo
    # gate can validate both deployment bases. The gh-pages mirror repeats the
    # full suite against its freshly built root artifact before publication.
    - ASTRO_BASE=/ npx --yes --package=pnpm@12.4.1 pnpm run build
    - mv dist dist-root
    - npx --yes --package=pnpm@12.4.1 pnpm run build
    - test -f dist/.nojekyll
    - test -d dist/assets
    - test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
    - test -f dist-root/.nojekyll
    - test -d dist-root/assets
  pages:
    publish: dist
  artifacts:
    paths:
      - dist
      - dist-root
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'

# Validate the artifacts produced by the Pages job instead of re-scanning the
# removed root static-site corpus. This keeps CI aligned with the same strict
# route, link, sitemap, and media checks used before publication.
#
# Both artifacts are validated, because a defect can exist at one base and not
# the other. `dist` is the artifact mounted below the GitLab Pages project
# subpath; `dist-root` is the CNAME-rooted artifact that ships to GitHub Pages.
# The gh-pages mirror repeats the shared suite against its own root build before
# it stages or publishes files.
quality:astro-artifact:
  stage: .post
  image: node:22-bookworm-slim
  needs:
    - job: pages
      artifacts: true
  before_script:
    # Recreate the Pages build's base in this separate artifact-quality job.
    - export ASTRO_BASE="$(node scripts/quality/resolve-pages-base.mjs)"
  script:
    - |
      set -eu
      echo "Validating the GitLab Pages artifact (base ${ASTRO_BASE})"
      sh scripts/quality/validate-astro-artifact.sh dist "${ASTRO_BASE}"

      echo "Validating the shipped GitHub Pages artifact (base /)"
      # The shared validator also runs in the mirror job against the artifact
      # it publishes, so a rebuilt artifact cannot bypass these checks.
      if [ "${ASTRO_BASE}" != "/" ]; then
        sh scripts/quality/validate-astro-artifact.sh dist-root / "${ASTRO_BASE}"
      else
        sh scripts/quality/validate-astro-artifact.sh dist-root /
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'

# The included mirror copied the GitLab checkout, so GitHub Pages received
# Astro source files instead of the generated dist/ artifact. Build in GitLab,
# then publish only the generated artifact on top of GitHub's existing history.
mirror:
  extends: []
  stage: mirror
  resource_group: instarlab-github-pages
  # This image includes git. Do not fall back to apt: shared Kubernetes
  # runners are unprivileged and cannot install packages at job time.
  image: node:22-bookworm
  variables:
    ASTRO_BASE: "/"
  before_script:
    - |
      set -eu
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "GITHUB_TOKEN is required for the GitHub mirror" >&2
        exit 1
      fi
      if ! command -v git >/dev/null 2>&1; then
        echo "The mirror image must provide git; refusing an in-job package install" >&2
        exit 1
      fi
      git --version
    - npx --yes --package=pnpm@12.4.1 pnpm --version
  script:
    # Do not expose the GitHub write token to dependency or build scripts.
    - env -u GITHUB_TOKEN npx --yes --package=pnpm@12.4.1 pnpm install --frozen-lockfile
    - echo "Building GitHub Pages artifact with ASTRO_BASE=${ASTRO_BASE}"
    - env -u GITHUB_TOKEN ASTRO_BASE=/ npx --yes --package=pnpm@12.4.1 pnpm run build
    - |
      set -euo pipefail
      test -d dist
      test -f dist/.nojekyll
      test -f dist/CNAME
      test -f dist/index.html
      test -z "$(find dist -type l -print -quit)"

      # This artifact ships to the CNAME-rooted site at https://instarlab.org,
      # where every route and asset URL must be root-relative. If ASTRO_BASE
      # stops being "/" the build silently switches to the GitLab project
      # subpath (/Website/) and the published site 404s. Run the full artifact
      # suite before any remote write, and fail closed when a check cannot run.
      if [ "${ASTRO_BASE:-}" != "/" ]; then
        echo "Refusing to mirror: ASTRO_BASE must be / for the CNAME-rooted site, got '${ASTRO_BASE:-<unset>}'" >&2
        exit 1
      fi

      # The same strict route, link, sitemap, media, provenance, metadata,
      # capture, structured-data, required-file, and base gates run on demo.
      # Strip the write token from validator processes; any failure exits
      # before artifact staging or remote access.
      env -u GITHUB_TOKEN sh scripts/quality/validate-astro-artifact.sh dist / /Website/

      artifact_dir="$(mktemp -d)"
      cp -a dist/. "${artifact_dir}/"
      test ! -e "${artifact_dir}/.git"

      write_manifest() {
        manifest_root="$1"
        (
          cd "${manifest_root}"
          find . -path './.git' -prune -o -type f -print | LC_ALL=C sort |
            while IFS= read -r path; do
              printf '%s  %s\n' \
                "$(sha256sum -- "${path}" | awk '{print $1}')" \
                "${path#./}"
            done
        )
      }

      write_index_manifest() {
        manifest_root="$1"
        (
          cd "${manifest_root}"
          git ls-files | LC_ALL=C sort |
            while IFS= read -r path; do
              printf '%s  %s\n' \
                "$(sha256sum -- "${path}" | awk '{print $1}')" \
                "${path}"
            done
        )
      }

      artifact_manifest="$(mktemp)"
      write_manifest "${artifact_dir}" > "${artifact_manifest}"

      # GitLab gh-pages is authoritative for what this pipeline may release.
      # This is intentionally independent of the GitHub artifact commit ID.
      gitlab_pages_sha="$(git ls-remote "${CI_REPOSITORY_URL}" refs/heads/gh-pages | awk 'NF {print $1; exit}')"
      if [ "${gitlab_pages_sha}" != "${CI_COMMIT_SHA}" ]; then
        echo "Refusing to mirror: GitLab gh-pages moved from ${CI_COMMIT_SHA} to ${gitlab_pages_sha:-<missing>}" >&2
        exit 1
      fi

      # Keep the token out of the remote URL, logs, and git config. Git uses
      # this helper only for the authenticated GitHub clone/fetch/push.
      github_repo_url="https://github.com/${GITHUB_REPO}.git"
      askpass="$(mktemp)"
      trap 'rm -f "${askpass}" "${artifact_manifest}"' EXIT
      cat > "${askpass}" <<'ASKPASS'
      #!/bin/sh
      case "$1" in
        *Username*) printf '%s\n' 'x-access-token' ;;
        *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "${askpass}"

      github_pages_sha="$(GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git ls-remote "${github_repo_url}" refs/heads/gh-pages | awk 'NF {print $1; exit}')"
      if [ -z "${github_pages_sha}" ]; then
        echo "Refusing to mirror: GitHub gh-pages does not exist or is unreadable" >&2
        exit 1
      fi

      publish_dir="$(mktemp -d)"
      GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git clone \
        --branch gh-pages "${github_repo_url}" "${publish_dir}"
      cloned_pages_sha="$(git -C "${publish_dir}" rev-parse HEAD)"
      if [ "${cloned_pages_sha}" != "${github_pages_sha}" ]; then
        echo "Refusing to mirror: GitHub gh-pages changed during clone" >&2
        exit 1
      fi

      git -C "${publish_dir}" remote rename origin github
      git -C "${publish_dir}" config user.name "GitLab CI"
      git -C "${publish_dir}" config user.email "gitlab-ci@${CI_SERVER_HOST}"
      git -C "${publish_dir}" rm -r --ignore-unmatch -- .
      git -C "${publish_dir}" clean -fdx
      cp -a "${artifact_dir}/." "${publish_dir}/"
      test -f "${publish_dir}/.nojekyll"
      test -f "${publish_dir}/CNAME"
      git -C "${publish_dir}" add --all -- .

      published_manifest="$(mktemp)"
      write_index_manifest "${publish_dir}" > "${published_manifest}"
      if ! cmp -s "${artifact_manifest}" "${published_manifest}"; then
        echo "Refusing to mirror: staged GitHub tree differs from generated dist artifact" >&2
        exit 1
      fi

      github_head_before_release="$(GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git ls-remote "${github_repo_url}" refs/heads/gh-pages | awk 'NF {print $1; exit}')"
      if [ "${github_head_before_release}" != "${github_pages_sha}" ]; then
        echo "Refusing to mirror: GitHub gh-pages diverged before release" >&2
        exit 1
      fi

      if git -C "${publish_dir}" diff --cached --quiet; then
        echo "GitHub gh-pages already contains the verified artifact"
        exit 0
      fi

      git -C "${publish_dir}" commit -m "Deploy ${CI_COMMIT_SHA}"
      test "$(git -C "${publish_dir}" rev-parse HEAD^)" = "${github_pages_sha}"

      # Re-check both authorities immediately before the non-fast-forward-safe
      # push. A concurrent GitLab promotion or GitHub update fails closed.
      gitlab_pages_sha_after="$(git ls-remote "${CI_REPOSITORY_URL}" refs/heads/gh-pages | awk 'NF {print $1; exit}')"
      test "${gitlab_pages_sha_after}" = "${CI_COMMIT_SHA}"
      github_head_before_push="$(GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git ls-remote "${github_repo_url}" refs/heads/gh-pages | awk 'NF {print $1; exit}')"
      test "${github_head_before_push}" = "${github_pages_sha}"
      GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git -C "${publish_dir}" push github HEAD:gh-pages

      github_pages_sha_after="$(GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 git ls-remote "${github_repo_url}" refs/heads/gh-pages | awk 'NF {print $1; exit}')"
      test "${github_pages_sha_after}" = "$(git -C "${publish_dir}" rev-parse HEAD)"
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'

# The push above completes before GitHub Pages has republished the artifact, so
# verify the live origin separately rather than asserting on the local build.
# This runs in the built-in .post stage — after the mirror, never before it —
# and fails the pipeline when the record surface the site advertises is not
# actually served. Because the push has already happened by then, a failure
# reports a published release rather than preventing one; that is the correct
# trade for a smoke test, and the retry budget below absorbs the publish delay.
smoke:live-record:
  extends: []
  stage: .post
  image: node:22-bookworm-slim
  needs:
    - job: mirror
  variables:
    SMOKE_ORIGIN: "https://www.instarlab.org"
    SMOKE_DELAY_MS: "15000"
    SMOKE_TIMEOUT_MS: "240000"
  script:
    - |
      set -eu
      smoke_script="$(mktemp)"
      trap 'rm -f "${smoke_script}"' EXIT
      # Fetch is a Node built-in, so the check needs no curl in the image.
      cat > "${smoke_script}" <<'SMOKE'
      const origin = (process.env.SMOKE_ORIGIN ?? "").replace(/\/+$/, "");
      const delayMs = Number.parseInt(process.env.SMOKE_DELAY_MS ?? "15000", 10);
      const timeoutMs = Number.parseInt(process.env.SMOKE_TIMEOUT_MS ?? "240000", 10);
      const requestTimeoutMs = 20000;

      // The record surface the published site tells readers to rely on.
      const targets = [
        { path: "/record/meta.json", kind: "json" },
        { path: "/record/ops/", kind: "html" },
      ];

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function probe(target) {
        const response = await fetch(`${origin}${target.path}`, {
          redirect: "follow",
          cache: "no-store",
          signal: AbortSignal.timeout(requestTimeoutMs),
          headers: { "user-agent": "instarlab-launch-sequence-smoke" },
        });
        const body = await response.text();
        if (response.status !== 200) return { ok: false, detail: `HTTP ${response.status}` };
        if (target.kind === "json") {
          let payload;
          try {
            payload = JSON.parse(body);
          } catch (error) {
            return { ok: false, detail: `body was not JSON (${error.message})` };
          }
          if (payload === null || typeof payload !== "object") {
            return { ok: false, detail: "JSON body was not an object" };
          }
          return { ok: true, detail: `HTTP 200 JSON object, ${body.length} bytes` };
        }
        const contentType = response.headers.get("content-type") ?? "";
        if (!contentType.includes("text/html")) {
          return { ok: false, detail: `content-type was ${contentType || "<missing>"}` };
        }
        if (!/<html[\s>]/i.test(body)) {
          return { ok: false, detail: "body was not an HTML document" };
        }
        return { ok: true, detail: `HTTP 200 HTML document, ${body.length} bytes` };
      }

      async function main() {
        if (!/^https?:\/\/[^/]+$/.test(origin)) {
          console.error(`SMOKE_ORIGIN must be a bare http(s) origin, got ${JSON.stringify(origin)}`);
          return 1;
        }
        if (!Number.isInteger(delayMs) || delayMs < 1000) {
          console.error(`SMOKE_DELAY_MS must be an integer of at least 1000 ms, got ${process.env.SMOKE_DELAY_MS}`);
          return 1;
        }
        if (!Number.isInteger(timeoutMs) || timeoutMs < 1) {
          console.error(`SMOKE_TIMEOUT_MS must be a positive integer, got ${process.env.SMOKE_TIMEOUT_MS}`);
          return 1;
        }

        let failed = 0;
        for (const target of targets) {
          const deadline = Date.now() + timeoutMs;
          let outcome = { ok: false, detail: "not attempted" };
          let attempts = 0;
          while (true) {
            attempts += 1;
            try {
              outcome = await probe(target);
            } catch (error) {
              outcome = { ok: false, detail: `fetch failed: ${error?.message ?? error}` };
            }
            if (outcome.ok) break;
            const remaining = deadline - Date.now();
            if (remaining <= 0) break;
            const wait = Math.min(delayMs, remaining);
            console.log(`${origin}${target.path}: attempt ${attempts} not ready (${outcome.detail}); retrying in ${wait} ms`);
            await sleep(wait);
          }
          if (outcome.ok) {
            console.log(`OK   ${origin}${target.path}: ${outcome.detail} after ${attempts} attempt(s)`);
          } else {
            failed += 1;
            console.error(`FAIL ${origin}${target.path}: ${outcome.detail} after ${attempts} attempt(s)`);
          }
        }

        if (failed > 0) {
          console.error(`The published site did not serve ${failed} of ${targets.length} required record endpoint(s).`);
          return 1;
        }
        console.log(`Verified ${targets.length} live record endpoint(s) on ${origin}.`);
        return 0;
      }

      main()
        .then((code) => process.exit(code))
        .catch((error) => {
          console.error(`live record smoke check crashed: ${error?.stack ?? error}`);
          process.exit(1);
        });
      SMOKE
      node "${smoke_script}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'

# Monthly site-health sweep (gh#283). Dormant until an owner creates a CI
# schedule targeting a branch: the rules below match scheduled pipelines
# only, so ordinary pushes never run this job. It rebuilds the release
# artifact from the scheduled ref and re-runs the release-quality checks
# (routes, links, sitemap, media, provenance, metadata) to catch drift that
# per-push runs cannot see — destinations that rotted while no source file
# changed. A failure surfaces as a failed scheduled pipeline with the check
# output attached, which is the machine-readable report the on-call agent
# acts on. Lighthouse sampling stays out until gh#266 lands a calibrated
# budget; this job must never fail on an uncalibrated perf number.
sweep:site-health:
  extends: []
  stage: preflight
  image: node:22-bookworm-slim
  before_script:
    - npx --yes --package=pnpm@12.4.1 pnpm --version
  script:
    - npx --yes --package=pnpm@12.4.1 pnpm install --frozen-lockfile
    - ASTRO_BASE=/ npx --yes --package=pnpm@12.4.1 pnpm run build
    - node scripts/quality/route-ledger.mjs --dist dist --strict
    - node scripts/quality/check-dist-links.mjs --dist dist --base /
    - node scripts/quality/check-dist-sitemap.mjs --dist dist --origin https://www.instarlab.org --base /
    - node scripts/quality/media-audit.mjs --dist dist --strict
    - node scripts/quality/check-dist-provenance.mjs --dist dist
    - node scripts/quality/validate-dist-metadata.mjs --dist dist
    - node scripts/quality/capture-record-visuals.mjs --check --dist dist --base / --strict
    - test -f dist/rss.xml
    - test -f dist/sitemap.xml
    - test -f dist/sitemap-index.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
