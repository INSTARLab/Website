include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: v0.2.5
    file: '/pipelines/static-site.yml'

variables:
  GITHUB_REPO: "INSTARLab/Website"
  SITE_DIR: "."

# Astro owns the production artifact. The Pages job uses the same pinned
# toolchain as local development and publishes the generated dist/ directory.
deploy:gitlab-pages:
  stage: .post
  image: node:22-bookworm-slim
  before_script:
    # Shared runners are unprivileged, so Corepack cannot write under
    # /usr/local/bin. Run the pinned pnpm release from npx's user cache.
    - npx --yes --package=pnpm@11.22.0 pnpm --version
  script:
    - npx --yes --package=pnpm@11.22.0 pnpm install --frozen-lockfile
    - npx --yes --package=pnpm@11.22.0 pnpm run build
  pages:
    publish: dist
  artifacts:
    paths:
      - dist
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'

# Validate the artifact produced by the Pages job instead of re-scanning the
# removed root static-site corpus. This keeps CI aligned with the same strict
# route, link, sitemap, and media checks used before publication.
quality:astro-artifact:
  stage: .post
  image: node:22-bookworm-slim
  needs:
    - job: deploy:gitlab-pages
      artifacts: true
  script:
    - node scripts/quality/route-ledger.mjs --dist dist --strict
    - node scripts/quality/check-dist-links.mjs --dist dist
    - node scripts/quality/check-dist-sitemap.mjs --dist dist --origin https://instarlab.org
    - node scripts/quality/media-audit.mjs --dist dist
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo"'
